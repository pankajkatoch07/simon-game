<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h3>Press any key to start!</h3>
    <p><b></b></p>
    <main class="btn-container">
        <div class="part1">
        <div class="btn one" type="button" id="blue">1</div>
        <div class="btn two" type="button" id="red">2</div>
    </div>
        <div class="part2">
        <div class="btn three" type="button" id="yellow">3</div>  
        <!-- we can give multiple classes inside one class -->
         <!-- we can give button type to divs -->
        <div class="btn four" type="button" id="green">4</div>
    </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
